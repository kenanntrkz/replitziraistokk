{% extends 'layout.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <div class="d-flex justify-content-between align-items-center">
            <h1>
                <i class="fas fa-edit me-2"></i> Bag Düzenle: {{ bag.ad }}
            </h1>
            <a href="{{ url_for('baglar') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Geri
            </a>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Bag Bilgilerini Düzenle</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('bag_duzenle', id=bag.id) }}">
                    <div class="mb-3">
                        <label for="ad" class="form-label">Bag Adı</label>
                        <input type="text" class="form-control" id="ad" name="ad" value="{{ bag.ad }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="alan" class="form-label">Alan (Dönüm)</label>
                        <input type="number" step="0.01" class="form-control" id="alan" name="alan" value="{{ bag.alan }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="ekim_tipi" class="form-label">Ekim Tipi / Üzüm Çesidi</label>
                        <input type="text" class="form-control" id="ekim_tipi" name="ekim_tipi" value="{{ bag.ekim_tipi or '' }}">
                    </div>
                    <div class="mb-3">
                        <label for="gps_koordinat" class="form-label">GPS Koordinatları</label>
                        <input type="text" class="form-control" id="gps_koordinat" name="gps_koordinat" value="{{ bag.gps_koordinat or '' }}" placeholder="Örn: 38.123456, 27.123456">
                    </div>
                    <div class="mb-3">
                        <label for="aciklama" class="form-label">Açıklama</label>
                        <textarea class="form-control" id="aciklama" name="aciklama" rows="3">{{ bag.aciklama or '' }}</textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="aktif" name="aktif" {% if bag.aktif %}checked{% endif %}>
                        <label class="form-check-label" for="aktif">Aktif</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Kaydet
                        </button>
                        <a href="{{ url_for('baglar') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> İptal
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
